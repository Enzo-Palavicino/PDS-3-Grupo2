# Configuración de Alembic, la herramienta de migraciones de la base de datos.
# La URL de la base de datos no va aquí: migrations/env.py la toma de DATABASE_URL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Las migraciones se llaman <revisión>_<descripción>.py, por ejemplo 0001_esquema_inicial.py.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
